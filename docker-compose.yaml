services:
  jwt-generator:
    container_name: giwa-jwt-generator
    image: alpine/openssl
    entrypoint: >
      /bin/sh -c "[ ! -s /shared/jwtsecret.key ] && openssl rand -hex 32 | tr -d '\n' > /shared/jwtsecret.key || exit 0"
    volumes:
      - shared:/shared
    restart: "no"
  execution:
    container_name: giwa-el
    depends_on:
      jwt-generator:
        condition: service_completed_successfully
    build:
      context: .
      dockerfile: ./reth/Dockerfile
      args:
        RETH_VERSION: v2.3.3
    env_file:
      - ${NETWORK_ENV:-.env.sepolia}
    environment:
      RETH_HTTP_PORT: ${RETH_HTTP_PORT:-8545}
      RETH_WS_PORT: ${RETH_WS_PORT:-8546}
      RETH_METRICS_PORT: ${RETH_METRICS_PORT:-6060}
      RETH_PORT: ${RETH_PORT:-30303}
      RETH_DISCOVERY_PORT: ${RETH_DISCOVERY_PORT:-30303}
    ports:
      - "${RETH_HTTP_PORT:-8545}:${RETH_HTTP_PORT:-8545}"
      - "${RETH_WS_PORT:-8546}:${RETH_WS_PORT:-8546}"
      - "7301:${RETH_METRICS_PORT:-6060}"
      - "${RETH_PORT:-30303}:${RETH_PORT:-30303}"
      - "${RETH_DISCOVERY_PORT:-30303}:${RETH_DISCOVERY_PORT:-30303}/udp"
    volumes:
      - shared:/shared
      - ${DATA_DIR}:/app/data
  consensus:
    container_name: giwa-cl
    depends_on:
      jwt-generator:
        condition: service_completed_successfully
      execution:
        condition: service_started
    build:
      context: .
      dockerfile: ./node/Dockerfile
      args:
        OPNODE_VERSION: v1.19.5
    env_file:
      - ${NETWORK_ENV:-.env.sepolia}
    environment:
      OP_NODE_L2_ENGINE_KIND: reth
      OP_NODE_RPC_PORT: ${OP_NODE_RPC_PORT:-9545}
      OP_NODE_P2P_LISTEN_TCP_PORT: ${OP_NODE_P2P_LISTEN_TCP_PORT:-9222}
      OP_NODE_P2P_LISTEN_UDP_PORT: ${OP_NODE_P2P_LISTEN_UDP_PORT:-9222}
      OP_NODE_METRICS_PORT: ${OP_NODE_METRICS_PORT:-7300}
    ports:
      - "${OP_NODE_RPC_PORT:-9545}:${OP_NODE_RPC_PORT:-9545}"
      - "${OP_NODE_P2P_LISTEN_TCP_PORT:-9222}:${OP_NODE_P2P_LISTEN_TCP_PORT:-9222}"
      - "${OP_NODE_P2P_LISTEN_UDP_PORT:-9222}:${OP_NODE_P2P_LISTEN_UDP_PORT:-9222}/udp"
      - "${OP_NODE_METRICS_PORT:-7300}:${OP_NODE_METRICS_PORT:-7300}"
    volumes:
      - shared:/shared

volumes:
  shared:
